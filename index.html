html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
.wrap{max-width:820px;margin:0 auto;padding:0 0 60px;}

.masthead{background:linear-gradient(150deg,#101B3D 0%,var(--navy) 30%,#2E3F7C 62%,#3E4F94 85%,var(--gold-2) 140%);padding:22px 18px 20px;position:relative;overflow:hidden;border-bottom:2px solid var(--gold);}
.masthead::before{content:"";position:absolute;top:-40%;right:-15%;width:60%;height:180%;background:radial-gradient(circle,rgba(201,154,62,.28) 0%,transparent 65%);pointer-events:none;}
.masthead::after{content:"";position:absolute;inset:0;opacity:.10;background-image:radial-gradient(circle at 15% 20%, transparent 38%, rgba(255,255,255,.5) 38.5%, transparent 39%),radial-gradient(circle at 85% 70%, transparent 46%, rgba(255,255,255,.4) 46.5%, transparent 47%);pointer-events:none;}
.crestrow{display:flex;align-items:center;gap:13px;position:relative;}
.crest{flex:0 0 auto;}
.crest svg{display:block;}
.school-name{font-family:var(--serif);font-weight:600;font-size:21px;color:#fff;letter-spacing:.2px;line-height:1.15;}
.school-tag{color:var(--masthead-tag);font-size:12px;margin-top:3px;position:relative;}
.namebar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.75);margin-top:14px;position:relative;}
.namebar b{color:#fff;}
.signout{color:var(--gold-soft);text-decoration:underline;cursor:pointer;background:none;border:none;font-size:12px;padding:0;font-family:var(--sans);}

.offline-banner{background:var(--gold-soft);color:#54430e;font-size:12px;text-align:center;padding:7px;border-radius:8px;margin:12px 18px 0;display:none;}
.offline-banner.show{display:block;}

.content{padding:16px 14px 0;}
.sub{color:var(--sub);font-size:12.5px;margin:2px 0 14px;}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.tab{flex:0 0 auto;padding:8px 11px 9px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--sub);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:var(--sans);display:flex;align-items:center;gap:5px;}
.tab.active{color:var(--crest);border-bottom-color:var(--gold);}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
h2{font-family:var(--serif);font-weight:600;font-size:16px;margin:0 0 12px;color:var(--text);}
label{display:block;font-size:11.5px;color:var(--sub);margin:9px 0 4px;}
input,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px;font-family:var(--sans);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
textarea{resize:vertical;min-height:52px;}
button{cursor:pointer;border:none;border-radius:8px;font-weight:600;font-size:13px;padding:10px 15px;font-family:var(--sans);transition:transform .08s ease;min-height:36px;}

button:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;margin-top:10px;}

.btn-sm{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 10px;font-size:11.5px;}
.btn-danger{background:transparent;border:1px solid var(--brick);color:var(--brick);padding:6px 10px;font-size:11.5px;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.row > *{flex:1;min-width:120px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-size:11px;font-weight:600;border-bottom:2px solid var(--gold);padding-bottom:8px;}
tr:nth-child(even) td{background:rgba(0,0,0,.015);}

.pill-bad{background:rgba(181,75,58,0.13);color:var(--brick);}

.msg,.notice{border-left:3px solid var(--crest);padding:8px 11px;margin-bottom:7px;background:rgba(201,154,62,0.05);border-radius:0 8px 8px 0;font-size:13px;}

.timetable{border-collapse:collapse;width:100%;font-size:12px;}

.timetable input{font-size:11px;padding:4px;text-align:center;}

.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
.stamp{background:linear-gradient(160deg,var(--card),rgba(201,154,62,0.05));border:1.5px dashed var(--gold);border-radius:14px;padding:16px 14px;text-align:center;}

.stamp h2{font-size:14px;margin-bottom:8px;}
.chip-white{display:inline-block;padding:4px 11px;border-radius:7px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy-2));}
.chip-green{display:inline-block;padding:4px 11px;border-radius:7px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1E7A66,#33B08C);margin-top:8px;}
.chip-red{display:inline-block;padding:4px 11px;border-radius:7px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#B54B3A,#DD6B52);}
.chip-blue{display:inline-block;padding:4px 11px;border-radius:7px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1D4FA8,#3E7CDB);}
.chip-gold{display:inline-block;padding:4px 11px;border-radius:7px;font-size:12px;font-weight:700;color:#2e2408;background:linear-gradient(135deg,var(--gold),var(--gold-2));}
.chip-yellow{display:inline-block;padding:4px 11px;border-radius:7px;font-size:12px;font-weight:700;color:#4a3b00;background:linear-gradient(135deg,#F2C744,#E0A800);}
.subtabs{display:flex;gap:6px;margin-bottom:12px;}
.subtab{padding:6px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;}
.subtab.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.dashgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.dashcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;}
.dashcard .big{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--crest);}
.dashcard .lbl{color:var(--sub);font-size:12px;margin-top:4px;}

.loginwrap{max-width:340px;margin:60px auto 0;padding:0 16px;}
.role-badge{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700;background:var(--gold);color:#2e2408;margin-left:5px;}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px;}
.table-wrap table{min-width:420px;}
@media (min-width:860px){ .wrap{max-width:920px;} }
.empty{color:var(--sub);font-size:13px;text-align:center;padding:18px 0;}
.error{color:var(--brick);font-size:13px;}
select{background:var(--card);}

async function uploadStudentPhoto(studentId, file){
  const ext = (file.name.split(".").pop()||"jpg").toLowerCase();
  const ref = storage.ref(`student-photos/${studentId}_${Date.now()}.${ext}`);
  await ref.put(file);
  const url = await ref.getDownloadURL();
  await firestore.collection("students").doc(studentId).update({photoUrl: url});
  logActivity("update", "students/"+studentId, "photo uploaded");
  return url;
}

let CURRENT_UID=null, CURRENT_USER="Staff", CURRENT_ROLE="teacher";

async function logActivity(action, target, summary){
  try{
    await firestore.collection("activityLog").add({ user: CURRENT_USER, action, target, summary: (summary||"").toString().slice(0,140), at: Date.now() });
  }catch(e){}
}

const db = {
  collection(name){
    return {
      onSnapshot(cb){
        return firestore.collection(name).onSnapshot(snap=>{
          cb({ docs: snap.docs.map(d=>({ id:d.id, data:d.data() })) });
        });
      },
      async add(obj){
        const ref = await firestore.collection(name).add(obj);
        logActivity("add", name, obj && (obj.name||obj.title||obj.subject||""));
        return ref;
      }
    };
  },
  doc(path){
    const ref = firestore.doc(path);
    return {
      onSnapshot(cb){
        return ref.onSnapshot(snap=>{
          cb({ exists: snap.exists, data: snap.exists ? snap.data() : undefined, id: snap.id });
        });
      },
      async get(){ const s = await ref.get(); return { exists: s.exists, data: s.exists ? s.data() : undefined, id: s.id }; },
      async set(obj){ await ref.set(obj, {merge:false}); logActivity("set", path, ""); },
      async update(obj){ await ref.update(obj); logActivity("update", path, Object.keys(obj).join(",")); },
      async delete(){ await ref.delete(); logActivity("delete", path, ""); }
    };
  }
};

window.addEventListener('unhandledrejection', function(e){
  const reason = e && e.reason ? (e.reason.message || e.reason.code || JSON.stringify(e.reason)) : "unknown error";
  alert("Save failed: " + reason);
});
window.addEventListener("online", ()=>{ const b=document.getElementById("offlineBanner"); if(b) b.classList.remove("show"); });
window.addEventListener("offline", ()=>{ const b=document.getElementById("offlineBanner"); if(b) b.classList.add("show"); });
if("serviceWorker" in navigator){ window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{})); }

const CLASS_LIST = ["Nursery","LKG","UKG","Class 1","Class 2","Class 3","Class 4","Class 5"];
const EXAM_TERMS = ["Weekly Test","Mid-Term","Final Term"];
let selectedTerm = EXAM_TERMS[0];

let LANG = localStorage.getItem("gps_lms_lang") || "en";
const TR = {
  "Dashboard":"ڈیش بورڈ","Classes":"جماعتیں","Students":"طلبہ","Attendance":"حاضری","Grades":"نتائج",
  "Fine":"جرمانہ","Homework":"ہوم ورک","Notices":"نوٹسز","Messages":"پیغامات","Timetable":"ٹائم ٹیبل",
  "Activity":"سرگرمی","Backup":"بیک اپ","Staff":"عملہ",
  "Staff sign-in":"عملے کے لیے سائن ان","Email":"ای میل","Password":"پاس ورڈ","Sign in":"سائن ان کریں",
  "Sign out":"سائن آؤٹ","Signed in as":"بطور سائن ان",
  "School Management System · Nursery to Class 5":"سکول مینجمنٹ سسٹم · نرسری تا پانچویں جماعت"
};
function t(s){ return LANG==="ur" ? (TR[s]||s) : s; }
function toggleLang(){ LANG = LANG==="en" ? "ur" : "en"; localStorage.setItem("gps_lms_lang", LANG); renderTabs(); renderMasthead(); }
function renderMasthead(){
  document.querySelector(".school-tag").textContent = t("School Management System · Nursery to Class 5");
  document.getElementById("langBtn").textContent = LANG==="en" ? "اردو" : "English";
  document.querySelector(".namebar span").innerHTML = t("Signed in as") + " <b id=\"userLabel\">" + esc(CURRENT_USER) + "</b><span class=\"role-badge\" id=\"roleBadge\">" + esc(CURRENT_ROLE) + "</span>";
}
let students=[], homework=[], notices=[], activityLog=[], staffList=[], tab="dashboard", selectedStudent=null, ttDoc={grid:{}}, attDate=todayStr(), classFilter="", listenersOn=false, staffSubTab="profile", staffAttDate=todayStr();

function todayStr(){ return new Date().toISOString().slice(0,10); }
function render(html){ document.getElementById("root").innerHTML = html; }
function esc(s){ return (s||"").toString().replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }
function classOptions(sel){ return CLASS_LIST.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join(""); }
function phoneDigits(s){ return (s||"").replace(/[^0-9]/g,""); }

// ---------------- LOGIN ----------------
function renderLogin(err){
  document.getElementById("namebar").style.display="none";
  render(`
    <div class="loginwrap">
      <div class="card">
        <h2>${t("Staff sign-in")}</h2>
        <p class="sub">Ask your admin to create your account first (Firebase Console → Authentication → Add user).</p>
        <label>${t("Email")}</label><input id="li_email" type="email">
        <label>${t("Password")}</label><input id="li_pass" type="password">
        <button class="btn-primary" id="loginBtn" style="width:100%;">${t("Sign in")}</button>
        ${err ? `<div class="error" style="margin-top:8px;">${esc(err)}</div>` : ""}
        <button class="btn-sm" id="langBtnLogin" style="width:100%;margin-top:8px;">${LANG==="en"?"اردو":"English"}</button>
      </div>
    </div>
  `);
  document.getElementById("langBtnLogin").onclick = ()=>{ toggleLang(); renderLogin(err); };
  document.getElementById("loginBtn").onclick = async ()=>{
    const email = document.getElementById("li_email").value.trim();
    const pass = document.getElementById("li_pass").value;
    if(!email||!pass) return;
    try{
      await firebase.auth().signInWithEmailAndPassword(email, pass);
    }catch(e){
      renderLogin(e.message || "Sign-in failed. Check your email and password.");
    }
  };
}

firebase.auth().onAuthStateChanged(async (user)=>{
  if(!user){ listenersOn=false; renderLogin(); return; }
  CURRENT_UID = user.uid;
  const staffRef = firestore.collection("staff").doc(user.uid);
  let staffSnap = await staffRef.get();
  if(!staffSnap.exists){
    const countSnap = await firestore.collection("staff").limit(1).get();
    const role = countSnap.empty ? "admin" : "teacher";
    const name = (user.email||"Staff").split("@")[0];
    await staffRef.set({ name, email:user.email||"", role, createdAt:Date.now() });
    staffSnap = await staffRef.get();
  }
  const sd = staffSnap.data();
  CURRENT_USER = sd.name || user.email || "Staff";
  CURRENT_ROLE = sd.role || "teacher";
  document.getElementById("userLabel").textContent = CURRENT_USER;
  document.getElementById("roleBadge").textContent = CURRENT_ROLE;
  document.getElementById("namebar").style.display="flex";
  if(!navigator.onLine) document.getElementById("offlineBanner").classList.add("show");
  init();
});

document.getElementById("signOutBtn").onclick = ()=> firebase.auth().signOut();
document.getElementById("langBtn").onclick = toggleLang;

// ---------------- INIT / LISTENERS ----------------
function init(){
  render(`<div class="empty">Connecting…</div>`);
  if(listenersOn){ tab="dashboard"; renderTabs(); return; }
  listenersOn = true;
  db.collection("activityLog").onSnapshot(snap=>{
    activityLog=(snap.docs||[]).map(d=>({id:d.id, ...d.data})).sort((a,b)=>(b.at||0)-(a.at||0));
    if(tab==="activity") renderTabs();
  });
  db.collection("staff").onSnapshot(snap=>{
    staffList=(snap.docs||[]).map(d=>({id:d.id, ...d.data}));
    if(tab==="staff") renderTabs();
  });
  db.collection("students").onSnapshot(snap=>{
    students = (snap.docs||[]).map(d=>({id:d.id, ...d.data}));
    if(selectedStudent && !students.find(s=>s.id===selectedStudent)) selectedStudent=null;
    renderTabs();
  });
  db.collection("homework").onSnapshot(snap=>{
    homework=(snap.docs||[]).map(d=>({id:d.id, ...d.data})).sort((a,b)=>(b.postedAt||0)-(a.postedAt||0));
    if(tab==="homework"||tab==="dashboard") renderTabs();
  });
  db.collection("notices").onSnapshot(snap=>{
    notices=(snap.docs||[]).map(d=>({id:d.id, ...d.data})).sort((a,b)=>(b.postedAt||0)-(a.postedAt||0));
    if(tab==="notices"||tab==="dashboard") renderTabs();
  });
  db.doc("timetable/main").onSnapshot(snap=>{
    ttDoc = (snap && snap.exists) ? snap.data : {grid:{}};
    if(tab==="timetable" && !(document.activeElement && document.activeElement.classList.contains("tt-cell"))) renderTabs();
  });
  renderTabs();
}

function setTab(t){ tab=t; renderTabs(); }

function renderTabs(){
  let tabs=[["dashboard","🏠","Dashboard"],["classes","🏫","Classes"],["students","🎓","Students"],["attendance","📋","Attendance"],["grades","📘","Grades"],["fine","⚖","Fine"],["homework","✎","Homework"],["notices","📣","Notices"],["messages","✉","Messages"],["timetable","🗓","Timetable"],["activity","📖","Activity"],["backup","⛁","Backup"]];
  if(CURRENT_ROLE==="admin") tabs.push(["staff","🧑‍🏫","Staff"]);
  render(`
    <div class="tabs">${tabs.map(([k,icon,l])=>`<div class="tab ${tab===k?'active':''}" data-tab="${k}"><span>${icon}</span>${t(l)}</div>`).join("")}</div>
    <div id="panel"></div>
  `);
  renderMasthead();
  document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>setTab(el.dataset.tab));
  const panel = document.getElementById("panel");
  const views = {dashboard:viewDashboard, classes:viewClasses, students:viewStudents, attendance:viewAttendance, grades:viewGrades, fine:viewFine, homework:viewHomework, notices:viewNotices, messages:viewMessages, timetable:viewTimetable, activity:viewActivity, backup:viewBackup, staff:viewStaff};
  panel.innerHTML = views[tab] ? views[tab]() : "";
  wireTab();
}

// ---------------- DASHBOARD ----------------
function viewDashboard(){
  const active = students.filter(s=>!s.archived);
  const today = todayStr();
  const present = active.filter(s=>(s.attendance||{})[today]==="present").length;
  const pct = active.length ? Math.round((present/active.length)*100) : 0;
  const hwDue = homework.filter(h=>!h.archived && h.dueDate===today).length;
  const fineOwed = active.filter(s=>s.fine && s.fine.amount>0 && !s.fine.paid).length;
  const latestNotice = notices.filter(n=>!n.archived)[0];
  return `
    <div class="dashgrid">
      <div class="dashcard"><div class="big">${active.length}</div><div class="lbl">active students</div></div>
      <div class="dashcard"><div class="big">${pct}%</div><div class="lbl">present today (${present}/${active.length})</div></div>
      <div class="dashcard"><div class="big">${hwDue}</div><div class="lbl">homework due today</div></div>
      <div class="dashcard"><div class="big">${fineOwed}</div><div class="lbl">students with unpaid fine</div></div>
    </div>
    <div class="card" style="margin-top:12px;">
      <h2>Latest notice</h2>
      ${latestNotice ? `<div class="notice"><b>${esc(latestNotice.title)}</b><div>${esc(latestNotice.message)}</div></div>` : `<div class="empty">No notices posted yet.</div>`}
    </div>
  `;
}

function viewClasses(){
  const promoBtn = CURRENT_ROLE==="admin" ? `<div class="card"><h2>Year-end class promotion</h2><p class="sub">Moves every active student up one class (Nursery → LKG → ... → Class 5). Class 5 students are marked as graduated and archived. This affects the whole school at once.</p><button class="btn-danger" id="promoteBtn">Promote all students to next class</button></div>` : "";
  const cards = CLASS_LIST.map(c=>{
    const list = students.filter(s=>s.className===c && !s.archived);
    const present = list.filter(s=>(s.attendance||{})[attDate]==="present").length;
    const initial = c.replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase();
    return `<div class="stamp">
      <div class="ring">${initial}</div>
      <h2>${c}</h2>
      <div class="chip-white">${list.length} enrolled</div>
      <div class="chip-green">${present} present today</div>
      <div><button class="btn-sm" style="margin-top:10px;" data-viewclass="${c}">View roster</button></div>
    </div>`;
  }).join("");
  return `${promoBtn}<div class="classgrid">${cards}</div>`;
}

async function promoteAllStudents(){
  const typed = prompt("This moves EVERY active student up one class, and graduates (archives) Class 5 students. This affects the whole school and cannot be easily undone.\n\nType PROMOTE to confirm:");
  if(typed!=="PROMOTE") return;
  const active = students.filter(s=>!s.archived);
  for(const s of active){
    const idx = CLASS_LIST.indexOf(s.className);
    if(idx<0) continue;
    if(idx === CLASS_LIST.length-1){
      await firestore.collection("students").doc(s.id).update({archived:true, archivedAt:Date.now(), graduated:true});
    } else {
      await firestore.collection("students").doc(s.id).update({className: CLASS_LIST[idx+1]});
    }
  }
  logActivity("promote", "students", `Promoted ${active.length} students`);
  alert("Promotion complete.");
}

// ---------------- ATTENDANCE ----------------
function viewAttendance(){
  const list = students.filter(s=>!classFilter || s.className===classFilter);
  const rows = list.map(s=>{
    const status = (s.attendance||{})[attDate] || "unmarked";
    return `<tr><td>${esc(s.name)}</td><td>${esc(s.className||"-")}</td><td>
      <button class="btn-sm ${status==='present'?'chip-green':''}" data-att="${s.id}|present">Present</button>
      <button class="btn-sm ${status==='absent'?'chip-red':''}" data-att="${s.id}|absent">Absent</button>
      <button class="btn-sm ${status==='leave'?'chip-blue':''}" data-att="${s.id}|leave">Leave</button>
    </td></tr>`;
  }).join("");
  return `
    <div class="card">
      <div class="row">
        <div><label>Date</label><input type="date" id="attDatePick" value="${attDate}"></div>
        <div><label>Class</label><select id="attClassPick"><option value="">All classes</option>${classOptions(classFilter)}</select></div>
      </div>
    </div>
    <div class="card">
      <h2>Mark attendance — ${attDate}</h2>
      ${list.length ? `<div class="table-wrap"><table><tr><th>Name</th><th>Class</th><th>Status</th></tr>${rows}</table></div>` : `<div class="empty">No students in this class yet.</div>`}
    </div>
    <div class="card">
      <h2>Monthly attendance summary — ${attDate.slice(0,7)}</h2>
      ${monthlyAttendanceTable(list, attDate.slice(0,7))}
    </div>
  `;
}

function monthlyAttendanceTable(list, monthKey){
  if(!list.length) return `<div class="empty">No students to summarize.</div>`;
  const rows = list.map(s=>{
    const att = s.attendance||{};
    let present=0, absent=0, leave=0, marked=0;
    Object.keys(att).forEach(d=>{
      if(!d.startsWith(monthKey)) return;
      marked++;
      if(att[d]==="present") present++;
      else if(att[d]==="absent") absent++;
      else if(att[d]==="leave") leave++;
    });
    const pct = marked ? Math.round((present/marked)*100) : 0;
    const flag = marked && pct<75 ? `<span class="chip-red">${pct}%</span>` : `<span class="chip-green">${pct}%</span>`;
    return `<tr><td>${esc(s.name)}</td><td>${esc(s.className||"-")}</td><td>${present}</td><td>${absent}</td><td>${leave}</td><td>${flag}</td></tr>`;
  }).join("");
  return `<div class="table-wrap"><table><tr><th>Name</th><th>Class</th><th>Present</th><th>Absent</th><th>Leave</th><th>Attendance %</th></tr>${rows}</table></div><p class="sub">Below 75% is flagged red — days with no mark aren't counted.</p>`;
}

// ---------------- GRADES ----------------
function isLegacyFlatGrades(g){
  return Object.values(g||{}).some(v=>v && typeof v==="object" && "obtained" in v);
}

function viewGrades(){
  const list = classFilter ? students.filter(s=>s.className===classFilter) : students;
  const opts = list.map(s=>`<option value="${s.id}" ${selectedStudent===s.id?'selected':''}>${esc(s.name)} (${esc(s.className||'-')})</option>`).join("");
  const stu = students.find(s=>s.id===selectedStudent);
  let body = `<div class="empty">Select a student to view/edit grades.</div>`;
  const termOptions = ["Previous entries", ...EXAM_TERMS].map(t=>`<option value="${t}" ${selectedTerm===t?'selected':''}>${t}</option>`).join("");
  if(stu){
    const g = stu.grades||{};
    const isLegacy = selectedTerm==="Previous entries";
    const subjMap = isLegacy ? g : (g[selectedTerm]||{});
    const rows = Object.keys(subjMap).map(subj=>{
      const v = subjMap[subj];
      const isObj = v && typeof v === "object";
      const obtained = isObj ? v.obtained : v;
      const total = isObj ? v.total : null;
      const pct = (isObj && total && !isNaN(obtained)) ? ((obtained/total)*100).toFixed(0)+'%' : '-';
      return `<tr><td>${esc(subj)}</td><td>${esc(obtained)}</td><td>${esc(total||'-')}</td><td>${pct}</td><td><button class="btn-danger" data-delgrade="${subj}">Remove</button></td></tr>`;
    }).join("");
    body = `
      <div class="row">
        <div><label>Exam term</label><select id="gradeTermSelect">${termOptions}</select></div>
      </div>
      ${rows ? `<div class="table-wrap"><table><tr><th>Subject</th><th>Obtained</th><th>Total</th><th>%</th><th></th></tr>${rows}</table></div>` : `<div class="empty">No grades recorded for ${esc(selectedTerm)}.</div>`}
      <h3>Add / Update subject grade</h3>
      <div class="row">
        <div><label>Subject</label><input id="g_subj" placeholder="e.g. Mathematics"></div>
        <div><label>Marks obtained</label><input id="g_score" type="number" placeholder="85"></div>
        <div><label>Total marks</label><input id="g_total" type="number" placeholder="100"></div>
      </div>
      <button class="btn-primary" id="saveGradeBtn">Save grade</button>
    `;
  }
  return `
    <div class="card">
      <div class="row">
        <div><label>Class filter</label><select id="gClassPick"><option value="">All classes</option>${classOptions(classFilter)}</select></div>
        <div><label>Student</label><select id="gStuPick"><option value="">-- Choose student --</option>${opts}</select></div>
      </div>
    </div>
    <div class="card">
      <h2>Grades record ${stu ? '— ' + esc(stu.name) : ''}</h2>
      ${body}
    </div>
  `;
}

function viewTimetable(){
  const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const periods = ["P1","P2","P3","P4","P5","P6"];

  let headerHtml = `<tr><th>Day</th>` + periods.map(p=>`<th>${p}</th>`).join("") + `</tr>`;

    }).join("");
    return `<tr><b><td>${d}</td></b>${cells}</tr>`;

}

// ---------------- EVENT WIRING ----------------
function wireTab(){
  if(document.getElementById("promoteBtn")){
    document.getElementById("promoteBtn").onclick = promoteAllStudents;
  }
  if(document.getElementById("addStudentBtn")){
    document.getElementById("addStudentBtn").onclick = async ()=>{
      await addStudent();
      renderTabs();
    };
  }
  if(document.getElementById("stuSearch")){
    document.getElementById("stuSearch").oninput = (e)=>{
      window.__stuSearch = e.target.value;
      renderTabs();
    };
  }
  if(document.getElementById("stuClassFilter")){
    document.getElementById("stuClassFilter").onchange = (e)=>{
      classFilter = e.target.value;
      renderTabs();
    };
  }
  if(document.getElementById("attDatePick")){
    document.getElementById("attDatePick").onchange = (e)=>{
      attDate = e.target.value;
      renderTabs();
    };
  }
  if(document.getElementById("attClassPick")){
    document.getElementById("attClassPick").onchange = (e)=>{
      classFilter = e.target.value;
      renderTabs();
    };
  }
  if(document.getElementById("gClassPick")){
    document.getElementById("gClassPick").onchange = (e)=>{
      classFilter = e.target.value;
      renderTabs();
    };
  }
  if(document.getElementById("gStuPick")){
    document.getElementById("gStuPick").onchange = (e)=>{
      selectedStudent = e.target.value;
      renderTabs();
    };
  }
  if(document.getElementById("gradeTermSelect")){
    document.getElementById("gradeTermSelect").onchange = (e)=>{
      selectedTerm = e.target.value;
      renderTabs();
    };
  }
  if(document.getElementById("saveGradeBtn")){
    document.getElementById("saveGradeBtn").onclick = async ()=>{
      const subj = document.getElementById("g_subj").value.trim();
      const score = Number(document.getElementById("g_score").value);
      const total = Number(document.getElementById("g_total").value);
      if(!subj || isNaN(score) || !selectedStudent) return;
      const stu = students.find(s=>s.id===selectedStudent);
      const g = stu.grades || {};
      if(selectedTerm === "Previous entries"){
        g[subj] = total ? {obtained:score, total} : score;
      } else {
        if(!g[selectedTerm]) g[selectedTerm] = {};
        g[selectedTerm][subj] = total ? {obtained:score, total} : score;
      }
      await db.doc(`students/${selectedStudent}`).update({grades:g});
      renderTabs();
    };
  }
  if(document.getElementById("addFineBtn")){
    document.getElementById("addFineBtn").onclick = async ()=>{
      const id = document.getElementById("f_stu").value;
      const amt = Number(document.getElementById("f_amt").value);
      const reason = document.getElementById("f_reason").value.trim();
      if(!id || !amt) return;
      await db.doc(`students/${id}`).update({fine:{amount:amt, reason, paid:false}});
      renderTabs();
    };
  }
  if(document.getElementById("addHwBtn")){
    document.getElementById("addHwBtn").onclick = async ()=>{
      const className = document.getElementById("hw_class").value;
      const subject = document.getElementById("hw_subj").value.trim();
      const dueDate = document.getElementById("hw_due").value;
      const task = document.getElementById("hw_task").value.trim();
      if(!subject || !task) return;
      await db.collection("homework").add({className, subject, dueDate, task, postedAt:Date.now(), archived:false});
      renderTabs();
    };
  }
  if(document.getElementById("addNoticeBtn")){
    document.getElementById("addNoticeBtn").onclick = async ()=>{
      const title = document.getElementById("n_title").value.trim();
      const message = document.getElementById("n_msg").value.trim();
      if(!title || !message) return;
      await db.collection("notices").add({title, message, postedAt:Date.now(), archived:false});
      renderTabs();
    };
  }
  if(document.getElementById("mStuPick")){
    document.getElementById("mStuPick").onchange = (e)=>{
      selectedStudent = e.target.value;
      renderTabs();
    };
  }
  if(document.getElementById("sendMsgBtn")){
    document.getElementById("sendMsgBtn").onclick = async ()=>{
      const text = document.getElementById("m_text").value.trim();
      if(!text || !selectedStudent) return;
      const stu = students.find(s=>s.id===selectedStudent);
      const msgs = stu.messages || [];
      msgs.push({text, from:CURRENT_USER, at:Date.now()});
      await db.doc(`students/${selectedStudent}`).update({messages:msgs});
      renderTabs();
    };
  }
  if(document.getElementById("waMsgBtn")){
    document.getElementById("waMsgBtn").onclick = ()=>{
      const text = document.getElementById("m_text").value.trim();
      const stu = students.find(s=>s.id===selectedStudent);
      if(!stu || !stu.guardianContact) return;
      const phone = phoneDigits(stu.guardianContact);
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank');
    };
  }

  document.querySelectorAll(".tt-cell").forEach(input=>{
    input.onchange = async (e)=>{
      const key = e.target.dataset.key;
      const val = e.target.value;
      const grid = ttDoc.grid || {};
      grid[key] = val;
      await db.doc("timetable/main").set({grid});
    };
  });

  if(document.getElementById("exportBtn")){
    document.getElementById("exportBtn").onclick = ()=>{
      const data = JSON.stringify({students, homework, notices, staffList}, null, 2);
      const blob = new Blob([data], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `gps-khankot-backup-${todayStr()}.json`;
      a.click();
    };
  }

  if(document.getElementById("importBtn")){
    document.getElementById("importBtn").onclick = async ()=>{
      const file = document.getElementById("importFile").files[0];
      if(!file) return;
      const text = await file.text();
      try{
        const json = JSON.parse(text);
        if(json.students && Array.isArray(json.students)){
          for(const s of json.students){
            const id = s.id;
            delete s.id;
            if(id) await firestore.collection("students").doc(id).set(s, {merge:true});
            else await firestore.collection("students").add(s);
          }
        }
        alert("Backup restored successfully!");
        renderTabs();
      }catch(e){
        alert("Invalid backup file format.");
      }
    };
  }

  if(document.getElementById("addStaffBtn")){
    document.getElementById("addStaffBtn").onclick = async ()=>{
      const name = document.getElementById("st_name").value.trim();
      const email = document.getElementById("st_email").value.trim();
      const pass = document.getElementById("st_pass").value;
      const role = document.getElementById("st_role").value;
      if(!name || !email || !pass) return;
      try{
        const cred = await secondaryAuth.createUserWithEmailAndPassword(email, pass);
        await firestore.collection("staff").doc(cred.user.uid).set({name, email, role, createdAt:Date.now()});
        secondaryAuth.signOut();
        alert("Staff account created!");
        renderTabs();
      }catch(e){
        alert("Failed to create staff: " + e.message);
      }
    };
  }

  // Click delegates
  document.querySelectorAll("[data-open]").forEach(el=>el.onclick = ()=> { selectedStudent = el.dataset.open; tab = "messages"; renderTabs(); });
  document.querySelectorAll("[data-viewclass]").forEach(el=>el.onclick = ()=> { classFilter = el.dataset.viewclass; tab = "students"; renderTabs(); });
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick = async ()=> { await db.doc(`students/${el.dataset.del}`).update({archived:true}); renderTabs(); });
  document.querySelectorAll("[data-harddel]").forEach(el=>el.onclick = async ()=> { if(confirm("Permanently delete student?")) { await db.doc(`students/${el.dataset.harddel}`).delete(); renderTabs(); } });
  document.querySelectorAll("[data-restore]").forEach(el=>el.onclick = async ()=> { await db.doc(`students/${el.dataset.restore}`).update({archived:false}); renderTabs(); });
  document.querySelectorAll("[data-att]").forEach(el=>el.onclick = async ()=> {
    const [id, status] = el.dataset.att.split("|");
    const stu = students.find(s=>s.id===id);
    const att = stu.attendance || {};
    att[attDate] = status;
    await db.doc(`students/${id}`).update({attendance:att});
    renderTabs();
  });
  document.querySelectorAll("[data-delgrade]").forEach(el=>el.onclick = async ()=> {
    const subj = el.dataset.delgrade;
    const stu = students.find(s=>s.id===selectedStudent);
    const g = stu.grades || {};
    if(selectedTerm === "Previous entries") delete g[subj];
    else if(g[selectedTerm]) delete g[selectedTerm][subj];
    await db.doc(`students/${selectedStudent}`).update({grades:g});
    renderTabs();
  });
  document.querySelectorAll("[data-clearfine]").forEach(el=>el.onclick = async ()=> {
    await db.doc(`students/${el.dataset.clearfine}`).update({"fine.paid":true});
    renderTabs();
  });
  document.querySelectorAll("[data-delhw]").forEach(el=>el.onclick = async ()=> {
    await db.doc(`homework/${el.dataset.delhw}`).update({archived:true});
    renderTabs();
  });
  document.querySelectorAll("[data-delnotice]").forEach(el=>el.onclick = async ()=> {
    await db.doc(`notices/${el.dataset.delnotice}`).update({archived:true});
    renderTabs();
  });
  document.querySelectorAll("[data-delstaff]").forEach(el=>el.onclick = async ()=> {
    if(confirm("Delete staff member?")) { await db.doc(`staff/${el.dataset.delstaff}`).delete(); renderTabs(); }
  });
}
</script>
</body>
</html>
