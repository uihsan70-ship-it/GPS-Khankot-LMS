<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPS Khankot — SMS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16234A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16234A; --navy-2:#213363; --gold:#C99A3E; --gold-2:#B6842A; --gold-soft:#E9D19B; --crest:#16234A; --masthead-tag:#E9D19B;
  --bg:#F6F3EC; --card:#FFFFFF; --line:#E4DFD1; --text:#20263A; --sub:#6B7086;
  --emerald:#1E7A66; --brick:#B54B3A; --radius:10px;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1522; --card:#161D2E; --line:#293349; --text:#EDEEF3; --sub:#93A0BC; --gold-soft:#4A3E22; --crest:#D9B360; }
}
:root[data-theme="dark"]{ --bg:#0F1522; --card:#161D2E; --line:#293349; --text:#EDEEF3; --sub:#93A0BC; --crest:#D9B360; }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
.wrap{max-width:820px;margin:0 auto;padding:0 0 60px;}

.masthead{background:linear-gradient(150deg,#101B3D 0%,var(--navy) 30%,#2E3F7C 62%,#3E4F94 85%,var(--gold-2) 140%);padding:22px 18px 20px;position:relative;overflow:hidden;border-bottom:2px solid var(--gold);}
.masthead::before{content:"";position:absolute;top:-40%;right:-15%;width:60%;height:180%;background:radial-gradient(circle,rgba(201,154,62,.28) 0%,transparent 65%);pointer-events:none;}
.masthead::after{content:"";position:absolute;inset:0;opacity:.10;background-image:radial-gradient(circle at 15% 20%, transparent 38%, rgba(255,255,255,.5) 38.5%, transparent 39%),radial-gradient(circle at 85% 70%, transparent 46%, rgba(255,255,255,.4) 46.5%, transparent 47%);pointer-events:none;}
.crestrow{display:flex;align-items:center;gap:13px;position:relative;}
.crest{flex:0 0 auto;}
.crest svg{display:block;}
.school-name{font-family:var(--serif);font-weight:600;font-size:21px;color:#fff;letter-spacing:.2px;line-height:1.15;}
.school-tag{color:var(--masthead-tag);font-size:12px;margin-top:3px;position:relative;}
.namebar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.75);margin-top:14px;position:relative;}
.namebar b{color:#fff;}

.offline-banner{background:var(--gold-soft);color:#54430e;font-size:12px;text-align:center;padding:7px;border-radius:8px;margin:12px 18px 0;display:none;}
.offline-banner.show{display:block;}

.content{padding:16px 14px 0;}
.sub{color:var(--sub);font-size:12.5px;margin:2px 0 14px;}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;margin-bottom:16px;border-bottom:1px solid var(--line);}
.tab{flex:0 0 auto;padding:8px 11px 9px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--sub);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:var(--sans);display:flex;align-items:center;gap:5px;}
.tab.active{color:var(--crest);border-bottom-color:var(--gold);}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
h2{font-family:var(--serif);font-weight:600;font-size:16px;margin:0 0 12px;color:var(--text);}
label{display:block;font-size:11.5px;color:var(--sub);margin:9px 0 4px;}
input,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px;font-family:var(--sans);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
textarea{resize:vertical;min-height:52px;}
button{cursor:pointer;border:none;border-radius:8px;font-weight:600;font-size:13px;padding:10px 15px;font-family:var(--sans);transition:transform .08s ease;}
button:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;margin-top:10px;}
.btn-accent2{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#2e2408;margin-top:10px;}
.btn-sm{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 10px;font-size:11.5px;}
.btn-danger{background:transparent;border:1px solid var(--brick);color:var(--brick);padding:6px 10px;font-size:11.5px;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.row > *{flex:1;min-width:120px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-size:11px;font-weight:600;border-bottom:2px solid var(--gold);padding-bottom:8px;}
tr:nth-child(even) td{background:rgba(0,0,0,.015);}

.pill{display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:600;}
.pill-ok{background:rgba(30,122,102,0.13);color:var(--emerald);}
.pill-bad{background:rgba(181,75,58,0.13);color:var(--brick);}
.pill-note{background:rgba(22,35,74,0.08);color:var(--crest);}
.studlink{color:var(--crest);cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:2px;}

.msg,.notice{border-left:3px solid var(--crest);padding:8px 11px;margin-bottom:7px;background:rgba(201,154,62,0.05);border-radius:0 8px 8px 0;font-size:13px;}
.msg .meta,.notice .meta{color:var(--sub);font-size:10.5px;margin-top:3px;}
.hwcard{border-left:3px solid var(--gold);padding:9px 11px;margin-bottom:8px;background:rgba(201,154,62,0.07);border-radius:0 8px 8px 0;}
.hwcard .meta{color:var(--sub);font-size:11px;margin-top:4px;}

.timetable{border-collapse:collapse;width:100%;font-size:12px;}
.timetable th,.timetable td{border:1px solid var(--line);padding:4px;text-align:center;}
.timetable input{font-size:11px;padding:4px;text-align:center;}

.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
.stamp{background:linear-gradient(160deg,var(--card),rgba(201,154,62,0.05));border:1.5px dashed var(--gold);border-radius:14px;padding:16px 14px;text-align:center;}
.stamp .ring{width:54px;height:54px;border-radius:50%;border:2px solid var(--crest);background:radial-gradient(circle at 32% 30%,rgba(201,154,62,.20),transparent 70%);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:var(--serif);font-weight:600;font-size:18px;color:var(--crest);}
.stamp h2{font-size:14px;margin-bottom:2px;}
.stamp .num{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--crest);}

.empty{color:var(--sub);font-size:13px;text-align:center;padding:18px 0;}
.error{color:var(--brick);font-size:13px;}
select{background:var(--card);}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="crestrow">
      <div class="crest">
        <svg width="46" height="46" viewBox="0 0 46 46">
          <circle cx="23" cy="23" r="21" fill="var(--navy)" stroke="var(--gold)" stroke-width="2"/>
          <circle cx="23" cy="23" r="16" fill="none" stroke="var(--gold-soft)" stroke-width="1"/>
          <path d="M23 13 L27 21 L23 19 L19 21 Z" fill="var(--gold)"/>
          <rect x="14" y="24" width="18" height="9" rx="1" fill="none" stroke="var(--gold-soft)" stroke-width="1"/>
          <line x1="14" y1="28" x2="32" y2="28" stroke="var(--gold-soft)" stroke-width=".75"/>
        </svg>
      </div>
      <div>
        <div class="school-name">GPS Khankot</div>
        <div class="school-tag">School Management System · Nursery to Class 5</div>
      </div>
    </div>
    <div class="namebar"><span>Signed in as <b id="userLabel"></b></span></div>
  </div>
  <div class="offline-banner" id="offlineBanner">You're offline — changes are saved on this device and will sync automatically when you're back online.</div>
  <div class="content">
  <div id="root"><div class="empty">Loading…</div></div>
  </div>
</div>
<!-- Firebase (your own project — independent of Claude) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD3kc5RKyQMVtyS9yDWAJvdRxt3fO9wxDo",
  authDomain: "gps-khankot-lms.firebaseapp.com",
  projectId: "gps-khankot-lms",
  storageBucket: "gps-khankot-lms.firebasestorage.app",
  messagingSenderId: "762201981873",
  appId: "1:762201981873:web:9e2d3733fcbdf96bebf390"
};
firebase.initializeApp(firebaseConfig);
const firestore = firebase.firestore();
firestore.enablePersistence({ synchronizeTabs: true }).catch(()=>{});

const CURRENT_USER = (function(){
  let n = localStorage.getItem("gps_lms_user");
  if(!n){ n = prompt("Your name (for the activity log):") || "Staff"; localStorage.setItem("gps_lms_user", n); }
  return n;
})();

let authReady = firebase.auth().signInAnonymously().catch(err=>{
  render(`<div class="card error">Couldn't connect securely (${err.message}). Check your internet connection and reload.</div>`);
  throw err;
});

async function logActivity(action, target, summary){
  try{
    await firestore.collection("activityLog").add({ user: CURRENT_USER, action, target, summary: (summary||"").toString().slice(0,140), at: Date.now() });
  }catch(e){}
}

const db = {
  collection(name){
    return {
      onSnapshot(cb){
        return firestore.collection(name).onSnapshot(snap=>{
          cb({ docs: snap.docs.map(d=>({ id:d.id, data:d.data() })) });
        });
      },
      async add(obj){
        const ref = await firestore.collection(name).add(obj);
        logActivity("add", name, obj && (obj.name||obj.title||obj.subject||""));
        return ref;
      }
    };
  },
  doc(path){
    const ref = firestore.doc(path);
    return {
      onSnapshot(cb){
        return ref.onSnapshot(snap=>{
          cb({ exists: snap.exists, data: snap.exists ? snap.data() : undefined, id: snap.id });
        });
      },
      async set(obj){ await ref.set(obj, {merge:false}); logActivity("set", path, ""); },
      async update(obj){ await ref.update(obj); logActivity("update", path, Object.keys(obj).join(",")); },
      async delete(){ await ref.delete(); logActivity("delete", path, ""); }
    };
  }
};

window.addEventListener('unhandledrejection', function(e){
  const reason = e && e.reason ? (e.reason.message || e.reason.code || JSON.stringify(e.reason)) : "unknown error";
  alert("Save failed: " + reason);
});

window.addEventListener("online", ()=>{ const b=document.getElementById("offlineBanner"); if(b) b.classList.remove("show"); });
window.addEventListener("offline", ()=>{ const b=document.getElementById("offlineBanner"); if(b) b.classList.add("show"); });

if("serviceWorker" in navigator){ window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{})); }

const CLASS_LIST = ["Nursery","LKG","UKG","Class 1","Class 2","Class 3","Class 4","Class 5"];
let students=[], homework=[], notices=[], activityLog=[], tab="classes", selectedStudent=null, ttDoc={grid:{}}, attDate=todayStr(), classFilter="";

function todayStr(){ return new Date().toISOString().slice(0,10); }
function render(html){ document.getElementById("root").innerHTML = html; }
function esc(s){ return (s||"").toString().replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }
function classOptions(sel){ return CLASS_LIST.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join(""); }

async function init(){
  await authReady;
  render(`<div class="empty">Connecting…</div>`);
  db.collection("activityLog").onSnapshot(snap=>{
    activityLog=(snap.docs||[]).map(d=>({id:d.id, ...d.data})).sort((a,b)=>(b.at||0)-(a.at||0));
    if(tab==="activity") renderTabs();
  });
  db.collection("students").onSnapshot(snap=>{
    students = (snap.docs||[]).map(d=>({id:d.id, ...d.data}));
    if(selectedStudent && !students.find(s=>s.id===selectedStudent)) selectedStudent=null;
    renderTabs();
  });
  db.collection("homework").onSnapshot(snap=>{
    homework=(snap.docs||[]).map(d=>({id:d.id, ...d.data})).sort((a,b)=>(b.postedAt||0)-(a.postedAt||0));
    if(tab==="homework") renderTabs();
  });
  db.collection("notices").onSnapshot(snap=>{
    notices=(snap.docs||[]).map(d=>({id:d.id, ...d.data})).sort((a,b)=>(b.postedAt||0)-(a.postedAt||0));
    if(tab==="notices") renderTabs();
  });
  db.doc("timetable/main").onSnapshot(snap=>{
    ttDoc = (snap && snap.exists) ? snap.data : {grid:{}};
    if(tab==="timetable") renderTabs();
  });
  renderTabs();
}

function setTab(t){ tab=t; renderTabs(); }

function renderTabs(){
  const tabs=[["classes","🏫","Classes"],["students","🎓","Students"],["attendance","📋","Attendance"],["grades","📘","Grades"],["fees","🎫","Fees"],["homework","✎","Homework"],["notices","📣","Notices"],["messages","✉","Messages"],["timetable","🗓","Timetable"],["activity","📖","Activity"],["backup","⛁","Backup"]];
  render(`
    <div class="tabs">${tabs.map(([k,icon,l])=>`<div class="tab ${tab===k?'active':''}" data-tab="${k}"><span>${icon}</span>${l}</div>`).join("")}</div>
    <div id="panel"></div>
  `);
  document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>setTab(el.dataset.tab));
  const panel = document.getElementById("panel");
  const views = {classes:viewClasses, students:viewStudents, attendance:viewAttendance, grades:viewGrades, fees:viewFees, homework:viewHomework, notices:viewNotices, messages:viewMessages, timetable:viewTimetable, activity:viewActivity, backup:viewBackup};
  panel.innerHTML = views[tab]();
  wireTab();
}

function viewClasses(){
  const cards = CLASS_LIST.map(c=>{
    const list = students.filter(s=>s.className===c && !s.archived);
    const present = list.filter(s=>(s.attendance||{})[attDate]==="present").length;
    const initial = c.replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase();
    return `<div class="stamp">
      <div class="ring">${initial}</div>
      <h2>${c}</h2>
      <div class="num">${list.length}</div>
      <div class="sub" style="margin-bottom:6px;">student(s) enrolled</div>
      <div class="sub">Today: <span class="pill pill-ok">${present} present</span></div>
      <button class="btn-sm" style="margin-top:10px;" data-viewclass="${c}">View roster</button>
    </div>`;
  }).join("");
  return `<div class="classgrid">${cards}</div>`;
}

function viewStudents(){
  const base = classFilter ? students.filter(s=>s.className===classFilter) : students;
  const list = base.filter(s=>!s.archived);
  const archived = base.filter(s=>s.archived);
  const rows = list.map(s=>`
    <tr>
      <td><span class="studlink" data-open="${s.id}">${esc(s.name)}</span></td>
      <td>${esc(s.className||"-")}</td>
      <td>${s.notes ? `<span class="pill pill-note">Support notes</span>` : ""}</td>
      <td>${esc(s.guardianContact||"-")}</td>
      <td><button class="btn-danger" data-del="${s.id}">Archive</button></td>
    </tr>`).join("");
  const archRows = archived.map(s=>`
    <tr>
      <td>${esc(s.name)}</td><td>${esc(s.className||"-")}</td>
      <td><button class="btn-sm" data-restore="${s.id}">Restore</button></td>
    </tr>`).join("");
  return `
    <div class="card">
      <h2>Add student</h2>
      <div class="row">
        <div><label>Full name</label><input id="s_name"></div>
        <div><label>Class</label><select id="s_class">${classOptions()}</select></div>
      </div>
      <label>Guardian contact (phone/email)</label><input id="s_contact">
      <label>Support / special needs notes (optional)</label>
      <textarea id="s_notes" placeholder="e.g. needs extra reading time, uses hearing aid, IEP details..."></textarea>
      <button class="btn-primary" id="addStudentBtn">Add student</button>
    </div>
    <div class="card">
      <div class="row"><div><label>Filter by class</label><select id="stuClassFilter"><option value="">All classes</option>${classOptions(classFilter)}</select></div></div>
      <h2>Roster (${list.length})</h2>
      ${list.length ? `<table><tr><th>Name</th><th>Class</th><th>Notes</th><th>Guardian</th><th></th></tr>${rows}</table>` : `<div class="empty">No students in this view yet.</div>`}
    </div>
    ${archived.length ? `<div class="card"><h2>Archived (${archived.length}) — not deleted, just hidden</h2><table><tr><th>Name</th><th>Class</th><th></th></tr>${archRows}</table></div>` : ""}
  `;
}

async function addStudent(){
  const name=document.getElementById("s_name").value.trim();
  if(!name) return;
  const className=document.getElementById("s_class").value;
  const guardianContact=document.getElementById("s_contact").value.trim();
  const notes=document.getElementById("s_notes").value.trim();
  await db.collection("students").add({name, className, guardianContact, notes, fees:{amount:0,paid:false}, grades:{}, attendance:{}, messages:[]});
}

function viewAttendance(){
  const list = students.filter(s=>!classFilter || s.className===classFilter);
  const rows = list.map(s=>{
    const status = (s.attendance||{})[attDate] || "unmarked";
    return `<tr><td>${esc(s.name)}</td><td>${esc(s.className||"-")}</td><td>
      <button class="btn-sm" data-att="${s.id}|present" style="${status==='present'?'background:var(--ok);color:#fff;':''}">Present</button>
      <button class="btn-sm" data-att="${s.id}|absent" style="${status==='absent'?'background:var(--danger);color:#fff;':''}">Absent</button>
    </td></tr>`;
  }).join("");
  return `
    <div class="card">
      <div class="row">
        <div><label>Date</label><input type="date" id="attDatePick" value="${attDate}"></div>
        <div><label>Class</label><select id="attClassPick"><option value="">All classes</option>${classOptions(classFilter)}</select></div>
      </div>
    </div>
    <div class="card">
      <h2>Mark attendance — ${attDate}</h2>
      ${list.length ? `<table><tr><th>Name</th><th>Class</th><th>Status</th></tr>${rows}</table>` : `<div class="empty">No students in this class yet.</div>`}
    </div>
  `;
}

function viewGrades(){
  const list = classFilter ? students.filter(s=>s.className===classFilter) : students;
  const opts = list.map(s=>`<option value="${s.id}" ${selectedStudent===s.id?'selected':''}>${esc(s.name)} (${esc(s.className||'-')})</option>`).join("");
  const stu = students.find(s=>s.id===selectedStudent);
  let body = `<div class="empty">Select a student to view/edit grades.</div>`;
  if(stu){
    const g = stu.grades||{};
    const rows = Object.keys(g).map(subj=>`<tr><td>${esc(subj)}</td><td>${esc(g[subj])}</td><td><button class="btn-danger" data-delgrade="${esc(subj)}">Remove</button></td></tr>`).join("");
    body = `
      <table><tr><th>Subject</th><th>Grade</th><th></th></tr>${rows || `<tr><td colspan="3" class="empty">No grades recorded yet.</td></tr>`}</table>
      <div class="row" style="margin-top:10px;">
        <div><label>Subject</label><input id="g_subject" placeholder="e.g. Math"></div>
        <div><label>Grade / score</label><input id="g_value" placeholder="e.g. A or 85%"></div>
      </div>
      <button class="btn-primary" id="addGradeBtn">Save grade</button>
    `;
  }
  return `
    <div class="card"><div class="row">
      <div><label>Class</label><select id="gradeClassPick"><option value="">All classes</option>${classOptions(classFilter)}</select></div>
      <div><label>Student</label><select id="gradeStudentPick"><option value="">-- choose --</option>${opts}</select></div>
    </div></div>
    <div class="card"><h2>Report card ${stu?`— ${esc(stu.name)}`:""}</h2>${body}</div>
  `;
}

function viewFees(){
  const list = classFilter ? students.filter(s=>s.className===classFilter) : students;
  const rows = list.map(s=>{
    const f = s.fees || {amount:0,paid:false};
    return `<tr>
      <td>${esc(s.name)}</td>
      <td>${esc(s.className||"-")}</td>
      <td><input type="number" data-feeamt="${s.id}" value="${f.amount||0}" style="width:80px;"></td>
      <td>${f.paid ? `<span class="pill pill-ok">Paid</span>` : `<span class="pill pill-bad">Due</span>`}</td>
      <td><button class="btn-sm" data-feepaid="${s.id}|${!f.paid}">${f.paid ? "Mark unpaid" : "Mark paid"}</button></td>
    </tr>`;
  }).join("");
  return `
    <div class="card"><div class="row"><div><label>Class</label><select id="feeClassPick"><option value="">All classes</option>${classOptions(classFilter)}</select></div></div></div>
    <div class="card">
      <h2>Fee tracker</h2>
      ${list.length ? `<table><tr><th>Name</th><th>Class</th><th>Amount</th><th>Status</th><th></th></tr>${rows}</table>` : `<div class="empty">No students in this view yet.</div>`}
    </div>
  `;
}

function viewHomework(){
  const base = classFilter ? homework.filter(h=>h.className===classFilter) : homework;
  const list = base.filter(h=>!h.archived);
  const items = list.map(h=>`<div class="hwcard">
      <b>${esc(h.className)} — ${esc(h.subject)}</b>
      <div>${esc(h.description)}</div>
      <div class="meta">Due: ${esc(h.dueDate||"-")} · Posted ${new Date(h.postedAt).toLocaleDateString()}
        <button class="btn-danger" style="margin-left:8px;" data-delhw="${h.id}">Archive</button>
      </div>
    </div>`).join("");
  return `
    <div class="card">
      <h2>Post homework / assignment</h2>
      <div class="row">
        <div><label>Class</label><select id="hw_class">${classOptions()}</select></div>
        <div><label>Subject</label><input id="hw_subject" placeholder="e.g. Science"></div>
      </div>
      <label>Description</label><textarea id="hw_desc" placeholder="e.g. Complete worksheet page 12, questions 1-5"></textarea>
      <label>Due date</label><input type="date" id="hw_due">
      <button class="btn-accent2" id="postHwBtn">Post homework</button>
    </div>
    <div class="card">
      <div class="row"><div><label>Filter by class</label><select id="hwClassPick"><option value="">All classes</option>${classOptions(classFilter)}</select></div></div>
      <h2>Assigned homework</h2>
      ${items || `<div class="empty">No homework posted yet.</div>`}
    </div>
  `;
}

function viewNotices(){
  const items = notices.filter(n=>!n.archived).map(n=>`<div class="notice">
      <b>${esc(n.title)}</b>
      <div>${esc(n.message)}</div>
      <div class="meta">${new Date(n.postedAt).toLocaleString()} <button class="btn-danger" style="margin-left:8px;" data-delnotice="${n.id}">Archive</button></div>
    </div>`).join("");
  return `
    <div class="card">
      <h2>Post a school notice</h2>
      <label>Title</label><input id="nt_title" placeholder="e.g. School closed Friday">
      <label>Message</label><textarea id="nt_msg"></textarea>
      <button class="btn-primary" id="postNoticeBtn">Post notice</button>
    </div>
    <div class="card"><h2>All notices</h2>${items || `<div class="empty">No notices posted yet.</div>`}</div>
  `;
}

function viewMessages(){
  const opts = students.map(s=>`<option value="${s.id}" ${selectedStudent===s.id?'selected':''}>${esc(s.name)}</option>`).join("");
  const stu = students.find(s=>s.id===selectedStudent);
  let body = `<div class="empty">Select a student to message their guardian.</div>`;
  if(stu){
    const msgs=(stu.messages||[]).slice().reverse();
    body = `
      ${msgs.length ? msgs.map(m=>`<div class="msg">${esc(m.text)}<div class="meta">${new Date(m.at).toLocaleString()}</div></div>`).join("") : `<div class="empty">No messages yet.</div>`}
      <label>New message to ${esc(stu.guardianContact||"guardian")}</label>
      <textarea id="msgText" placeholder="e.g. Your child did great in today's reading assessment."></textarea>
      <button class="btn-primary" id="sendMsgBtn">Log message sent</button>
    `;
  }
  return `
    <div class="card"><label>Student</label><select id="msgStudentPick"><option value="">-- choose --</option>${opts}</select></div>
    <div class="card"><h2>Parent communication ${stu?`— ${esc(stu.name)}`:""}</h2>${body}</div>
  `;
}

function viewTimetable(){
  const days=["Mon","Tue","Wed","Thu","Fri"];
  const periods=[1,2,3,4,5,6];
  const grid = ttDoc.grid || {};
  const cls = classFilter || CLASS_LIST[0];
  let head = `<tr><th>Period</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr>`;
  let body = periods.map(p=>`<tr><td>${p}</td>${days.map(d=>{
    const key=cls+"_"+d+"_"+p; return `<td><input data-tt="${key}" value="${esc(grid[key]||"")}" placeholder="Subject"></td>`;
  }).join("")}</tr>`).join("");
  return `
    <div class="card"><div class="row"><div><label>Class</label><select id="ttClassPick">${classOptions(cls)}</select></div></div></div>
    <div class="card"><h2>Weekly timetable — ${cls}</h2><table class="timetable">${head}${body}</table><button class="btn-primary" id="saveTTBtn">Save timetable</button></div>
  `;
}

function viewActivity(){
  const byUser = {};
  activityLog.forEach(a=>{ byUser[a.user] = Math.max(byUser[a.user]||0, a.at||0); });
  const users = Object.keys(byUser).sort((a,b)=>byUser[b]-byUser[a]);
  const userCards = users.map(u=>`<div class="card" style="display:inline-block;min-width:150px;margin-right:8px;">
      <b>${esc(u)}</b><div class="sub">Last active: ${new Date(byUser[u]).toLocaleString()}</div>
    </div>`).join("");
  const rows = activityLog.slice(0,80).map(a=>`<tr>
      <td>${new Date(a.at).toLocaleString()}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td><td>${esc(a.summary||"")}</td>
    </tr>`).join("");
  return `
    <div class="card"><h2>Staff activity</h2>${userCards || `<div class="empty">No activity yet.</div>`}</div>
    <div class="card"><h2>Recent changes (${activityLog.length} total logged)</h2>
      ${rows ? `<table><tr><th>When</th><th>Who</th><th>Action</th><th>Where</th><th>Detail</th></tr>${rows}</table>` : `<div class="empty">Nothing logged yet.</div>`}
    </div>
  `;
}

function viewBackup(){
  return `
    <div class="card">
      <h2>Load demo data (for testing)</h2>
      <p class="sub">Adds 8 sample students (one per class) with attendance, grades, fees, homework, notices, a parent message, and a timetable — so you can click through every tab and see it working before using real records.</p>
      <button class="btn-accent2" id="seedDemoBtn">Load demo data</button>
    </div>
    <div class="card">
      <h2>Download a full backup</h2>
      <p class="sub">Saves every student record, homework, notices, timetable, and activity log as one file on this device. Nothing on the live app is changed — this is just a safety copy. Do this weekly (or before any big change) and keep the file in Google Drive, email, or a USB drive.</p>
      <button class="btn-primary" id="downloadBackupBtn">Download backup (.json)</button>
    </div>
    <div class="card">
      <h2>Why your data is already safe</h2>
      <p class="sub">• Records are stored on Google's Firestore — a durable, replicated database, not a single device.<br>
      • "Archive" buttons never permanently delete anything — archived items can always be restored (Students → Archived section).<br>
      • This backup file is an extra layer, useful if you ever need to move to a different system, or just for peace of mind.</p>
    </div>
  `;
}

function wireTab(){
  if(tab==="classes"){
    document.querySelectorAll("[data-viewclass]").forEach(el=>el.onclick=()=>{ classFilter=el.dataset.viewclass; setTab("students"); });
  }
  if(tab==="students"){
    document.getElementById("addStudentBtn").onclick = addStudent;
    document.getElementById("stuClassFilter").onchange = e=>{ classFilter=e.target.value; renderTabs(); };
    document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{ selectedStudent=el.dataset.open; setTab("grades"); });
    document.querySelectorAll("[data-del]").forEach(el=>el.onclick=async()=>{
      if(!confirm("Archive this student? They'll be hidden from the roster but ALL their data (attendance, grades, fees, messages) stays saved and can be restored anytime.")) return;
      await db.doc("students/"+el.dataset.del).update({archived:true, archivedAt:Date.now()});
    });
    document.querySelectorAll("[data-restore]").forEach(el=>el.onclick=async()=>{
      await db.doc("students/"+el.dataset.restore).update({archived:false});
    });
  }
  if(tab==="attendance"){
    document.getElementById("attDatePick").onchange = e=>{ attDate=e.target.value; renderTabs(); };
    document.getElementById("attClassPick").onchange = e=>{ classFilter=e.target.value; renderTabs(); };
    document.querySelectorAll("[data-att]").forEach(el=>el.onclick=async()=>{
      const [id,status]=el.dataset.att.split("|");
      const stu=students.find(s=>s.id===id);
      const attendance={...(stu.attendance||{}), [attDate]:status};
      await db.doc("students/"+id).update({attendance});
    });
  }
  if(tab==="grades"){
    document.getElementById("gradeClassPick").onchange = e=>{ classFilter=e.target.value; selectedStudent=null; renderTabs(); };
    document.getElementById("gradeStudentPick").onchange = e=>{ selectedStudent=e.target.value||null; renderTabs(); };
    const addBtn=document.getElementById("addGradeBtn");
    if(addBtn) addBtn.onclick=async()=>{
      const subj=document.getElementById("g_subject").value.trim();
      const val=document.getElementById("g_value").value.trim();
      if(!subj||!val) return;
      const stu=students.find(s=>s.id===selectedStudent);
      const grades={...(stu.grades||{}), [subj]:val};
      await db.doc("students/"+selectedStudent).update({grades});
    };
    document.querySelectorAll("[data-delgrade]").forEach(el=>el.onclick=async()=>{
      if(!confirm("Remove this grade entry? (You can re-add it if this was a mistake.)")) return;
      const stu=students.find(s=>s.id===selectedStudent);
      const grades={...(stu.grades||{})}; delete grades[el.dataset.delgrade];
      await db.doc("students/"+selectedStudent).update({grades});
    });
  }
  if(tab==="fees"){
    document.getElementById("feeClassPick").onchange = e=>{ classFilter=e.target.value; renderTabs(); };
    document.querySelectorAll("[data-feeamt]").forEach(el=>el.onchange=async()=>{
      const stu=students.find(s=>s.id===el.dataset.feeamt);
      const fees={...(stu.fees||{}), amount:parseFloat(el.value)||0};
      await db.doc("students/"+el.dataset.feeamt).update({fees});
    });
    document.querySelectorAll("[data-feepaid]").forEach(el=>el.onclick=async()=>{
      const [id,paidStr]=el.dataset.feepaid.split("|");
      const stu=students.find(s=>s.id===id);
      const fees={...(stu.fees||{}), paid: paidStr==="true"};
      await db.doc("students/"+id).update({fees});
    });
  }
  if(tab==="homework"){
    document.getElementById("hwClassPick").onchange = e=>{ classFilter=e.target.value; renderTabs(); };
    document.getElementById("postHwBtn").onclick=async()=>{
      const className=document.getElementById("hw_class").value;
      const subject=document.getElementById("hw_subject").value.trim();
      const description=document.getElementById("hw_desc").value.trim();
      const dueDate=document.getElementById("hw_due").value;
      if(!subject||!description) return;
      await db.collection("homework").add({className, subject, description, dueDate, postedAt:Date.now()});
    };
    document.querySelectorAll("[data-delhw]").forEach(el=>el.onclick=async()=>{
      if(!confirm("Archive this homework entry? It will be hidden but not permanently lost.")) return;
      await db.doc("homework/"+el.dataset.delhw).update({archived:true});
    });
  }
  if(tab==="notices"){
    document.getElementById("postNoticeBtn").onclick=async()=>{
      const title=document.getElementById("nt_title").value.trim();
      const message=document.getElementById("nt_msg").value.trim();
      if(!title||!message) return;
      await db.collection("notices").add({title, message, postedAt:Date.now()});
    };
    document.querySelectorAll("[data-delnotice]").forEach(el=>el.onclick=async()=>{
      if(!confirm("Archive this notice? It will be hidden but not permanently lost.")) return;
      await db.doc("notices/"+el.dataset.delnotice).update({archived:true});
    });
  }
  if(tab==="messages"){
    document.getElementById("msgStudentPick").onchange = e=>{ selectedStudent=e.target.value||null; renderTabs(); };
    const sendBtn=document.getElementById("sendMsgBtn");
    if(sendBtn) sendBtn.onclick=async()=>{
      const text=document.getElementById("msgText").value.trim();
      if(!text) return;
      const stu=students.find(s=>s.id===selectedStudent);
      const messages=[...(stu.messages||[]), {text, at:Date.now()}];
      await db.doc("students/"+selectedStudent).update({messages});
    };
  }
  if(tab==="timetable"){
    document.getElementById("ttClassPick").onchange = e=>{ classFilter=e.target.value; renderTabs(); };
    document.getElementById("saveTTBtn").onclick=async()=>{
      const grid={...(ttDoc.grid||{})};
      document.querySelectorAll("[data-tt]").forEach(el=>{ if(el.value.trim()) grid[el.dataset.tt]=el.value.trim(); else delete grid[el.dataset.tt]; });
      await db.doc("timetable/main").set({grid});
    };
  }
  if(tab==="backup"){
    document.getElementById("seedDemoBtn").onclick = seedDemoData;
    document.getElementById("downloadBackupBtn").onclick = downloadFullBackup;
  }
}

async function downloadFullBackup(){
  const btn = document.getElementById("downloadBackupBtn");
  btn.textContent = "Preparing backup…";
  const hwSnap = await firestore.collection("homework").get();
  const ntSnap = await firestore.collection("notices").get();
  const logSnap = await firestore.collection("activityLog").get();
  const ttSnap = await firestore.doc("timetable/main").get();
  const backup = {
    exportedAt: new Date().toISOString(),
    students: students.map(({id, ...rest})=>({id, ...rest})),
    homework: hwSnap.docs.map(d=>({id:d.id, ...d.data()})),
    notices: ntSnap.docs.map(d=>({id:d.id, ...d.data()})),
    activityLog: logSnap.docs.map(d=>({id:d.id, ...d.data()})),
    timetable: ttSnap.exists ? ttSnap.data() : {}
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "gps-khankot-backup-" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  btn.textContent = "Download backup (.json)";
}

if(!navigator.onLine) document.getElementById("offlineBanner").classList.add("show");
